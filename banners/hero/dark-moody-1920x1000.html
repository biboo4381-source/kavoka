<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.banner{background:radial-gradient(900px 640px at 70% 46%,rgba(212,175,124,.30),rgba(212,175,124,.06) 55%,transparent 75%),radial-gradient(700px 500px at 8% 100%,rgba(156,61,36,.22),transparent 70%),#120c08}
.ghost{position:absolute;left:50%;top:40px;transform:translateX(-50%);font-size:330px;font-weight:800;letter-spacing:.12em;color:transparent;-webkit-text-stroke:2px rgba(212,175,124,.10);white-space:nowrap;line-height:1}
.box{position:absolute;right:120px;top:120px;width:800px;filter:drop-shadow(0 60px 80px rgba(0,0,0,.7));-webkit-mask-image:radial-gradient(ellipse 60% 58% at 52% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 60% 58% at 52% 50%,#000 55%,transparent 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,#120c08 85%)}
.copy{position:absolute;left:180px;top:220px;width:820px}
.copy .eyebrow{color:#d4af7c;display:flex;align-items:center;gap:18px}
.copy .eyebrow::after{content:"";width:80px;height:1px;background:#d4af7c;opacity:.6}
h1{font-size:128px;line-height:1;font-weight:700;margin:30px 0 30px;letter-spacing:-.01em}
h1 em{color:#d4af7c;font-weight:600}
p.sub{font-size:24px;line-height:1.55;color:rgba(247,243,233,.78);max-width:640px}
.row{display:flex;align-items:center;gap:40px;margin-top:48px}
.cta{background:linear-gradient(135deg,#e8c995,#d4af7c 55%,#b88a52);color:#1e140e;box-shadow:0 18px 40px -14px rgba(212,175,124,.7)}
.price{font-size:46px;font-weight:700;color:#e8c995;line-height:1}.price small{display:block;font-family:Montserrat;font-size:15px;letter-spacing:.2em;color:rgba(247,243,233,.6);font-weight:500;margin-top:8px}
.chips{position:absolute;left:180px;right:180px;bottom:70px;display:flex;align-items:center;gap:16px;border-top:1px solid rgba(212,175,124,.25);padding-top:26px;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,243,233,.7)}
.chips b{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:10px;vertical-align:-1px}
.chips span{margin-right:26px}.chips .r{margin-left:auto;color:#d4af7c;margin-right:0}
.logo{position:absolute;left:180px;top:90px;display:flex;align-items:center;gap:16px}.logo img{width:64px;height:64px;border-radius:50%;border:1px solid rgba(212,175,124,.4)}
.logo div{font-size:30px;letter-spacing:.3em;color:#e8c995}.logo small{display:block;font-family:Montserrat;font-size:11px;letter-spacing:.34em;color:rgba(247,243,233,.55);margin-top:4px}
</style></head><body><div class="banner">
<div class="ghost serif">KAVØKA</div>
<img class="box" src="src/gift-box.webp" alt="">
<div class="floor"></div>
<div class="logo"><img src="src/emblem.webp" alt=""><div class="serif">KAVØKA<small>THE ART OF CACAO &amp; COFFEE</small></div></div>
<div class="copy">
<div class="eyebrow">New · Indonesia → Singapore</div>
<h1 class="serif">Two origins.<br><em>One bar.</em></h1>
<p class="sub">Indonesian coffee steeped into Indonesian cacao. Gift-ready, in four intensities.</p>
<div class="row"><a class="cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2 9a2 2 0 0 1-2 1.6H7A2 2 0 0 1 5 19z"/><path d="m8 10 3-6M16 10l-3-6"/></svg>Shop on TikTok Shop</a><div class="price serif">S$9.90<small>PER 50 G BAR</small></div></div>
</div>
<div class="chips"><span><b style="background:#6a1f17"></b>Extra Strong 80%</span><span><b style="background:#8a5532"></b>Strong 70%</span><span><b style="background:#c08a52"></b>Balanced 55%</span><span><b style="background:#f1e3c8"></b>Mild 40%</span><span class="r">Launch week · Buy 2, Mild free</span></div>
</div></body></html>
